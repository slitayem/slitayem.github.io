name: Build and deploy Jekyll site to GitHub Pages

# No push trigger anywhere: nothing lands on source/develop/master except via
# a merged pull request. Pipeline: source (human PR, where changes are
# implemented) -> develop (human PR, same Jekyll-source format as source, so
# these diffs stay meaningful) -> master (auto-promoted build from develop,
# GitHub Pages serves this). Pair with branch protection (require a PR before
# merging) on all three branches - see the deploy job for exactly what that
# requires.
on:
  pull_request:
    branches:
    - source
    - develop
    - master
    types: [opened, synchronize, reopened, closed]

# Least-privilege default; only the deploy job elevates, and only for the
# duration of the promotion steps.
permissions:
  contents: read

jobs:
  # Defense in depth alongside the `on.pull_request.branches` filter above.
  # Enforces the shape of the pipeline itself:
  #   -> source:  anything except the repo's legacy/long-lived branches
  #   -> develop: only 'source', literally - that's where changes are made
  #   -> master:  only this workflow's own build-promotion branches
  # A human (or a compromised token) opening a PR straight into master,
  # bypassing the automated build, gets rejected here.
  branch-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Enforce the branching model
      # base_ref/head_ref are attacker-controlled on a fork PR (they're just
      # branch names); pass them through env instead of interpolating the
      # ${{ }} expression directly into the script to avoid shell injection.
      env:
        BASE_REF: ${{ github.base_ref }}
        HEAD_REF: ${{ github.head_ref }}
      run: |
        set -euo pipefail
        base_ref="$BASE_REF"
        head_ref="$HEAD_REF"
        echo "PR: $head_ref -> $base_ref"

        case "$base_ref" in
          source)
            case "$head_ref" in
              master|develop|Source-04.07|backup-develop|backup-master|backup-source-failure|develop-04.07|master-04.07)
                echo "::error::'$head_ref' is a legacy branch and can't be merged into 'source'. Branch off the latest 'source' instead."
                exit 1
                ;;
            esac
            ;;
          develop)
            if [[ "$head_ref" != "source" ]]; then
              echo "::error::'develop' only accepts merges from 'source' (got '$head_ref'). Land your change on 'source' first."
              exit 1
            fi
            ;;
          master)
            if [[ "$head_ref" != promote/master-* ]]; then
              echo "::error::'master' can only be updated by this pipeline's automated promotion from 'develop' (got '$head_ref')."
              exit 1
            fi
            ;;
          *)
            echo "::error::Unexpected base branch '$base_ref'."
            exit 1
            ;;
        esac

  # Validates that a PR builds cleanly, for PRs into either `source` or
  # `develop`. Checks out the merge of the PR head into its base branch
  # (GitHub Actions' default ref for pull_request events) so it tests what
  # would actually land if the PR is merged.
  build:
    needs: branch-policy
    if: github.event.action != 'closed' && (github.base_ref == 'source' || github.base_ref == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
    - name: Checkout PR merge ref
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@086ffb1a2090c870a3f881cc91ea83aa4243d408
      with:
        ruby-version: '3.1'
        bundler-cache: true
    - name: Inject secrets
      uses: ./.github/actions/inject-secrets
      with:
        web3forms-access-key: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
    - name: Build Jekyll site
      shell: bash
      run: |
        set -euxo pipefail
        make rebuild

  # Only fires when a PR into `develop` is actually merged. Builds once and
  # opens a PR proposing that build as `master` - it stops there. Deployment
  # (GitHub Pages serving the new build) only happens once a human actually
  # merges that PR; this job never merges it itself.
  deploy:
    needs: branch-policy
    if: github.event.pull_request.merged == true && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: promote-develop-to-master
      cancel-in-progress: false
    # Needed to push the build-promotion branch and open the pull request
    # below - not to merge it, that's left to a human.
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout develop branch
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        ref: develop
        fetch-depth: 0
    - name: Set up Ruby
      uses: ruby/setup-ruby@086ffb1a2090c870a3f881cc91ea83aa4243d408
      with:
        ruby-version: '3.1'
        bundler-cache: true
    - name: Inject secrets
      uses: ./.github/actions/inject-secrets
      with:
        web3forms-access-key: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
    - name: Build Jekyll site
      shell: bash
      run: |
        set -euxo pipefail
        make rebuild
    - name: Propose build to master
      shell: bash
      run: |
        set -euxo pipefail
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        develop_sha="$(git rev-parse --short=10 HEAD)"
        branch="promote/master-${develop_sha}"

        # _site/ is gitignored, so it survives `clean` and the branch switch below.
        git clean -fd
        git fetch origin master
        git checkout -B "$branch" origin/master

        shopt -s extglob
        rm -rf -- !(_site)
        mv _site/* .
        make clean

        # master holds pre-built static output, not Jekyll source. Without
        # this, GitHub Pages runs its own Jekyll build on top of it anyway -
        # if that redundant build ever fails, Pages just keeps serving the
        # last version that built successfully, silently, with nothing
        # visible on our side to say a newer commit didn't go live.
        touch .nojekyll

        # if there are no changes to promote, stop here
        if [[ -z "$(git status --porcelain)" ]]; then
          echo "develop already matches master; nothing to promote."
          exit 0
        fi

        git add .
        git commit -m "Build ${develop_sha}"
        git push --force-with-lease origin "$branch"

        # Opened, not merged: a human merges this PR to actually publish.
        pr_url="$(gh pr create --head "$branch" --base master \
          --title "Promote build ${develop_sha} to master" \
          --body "Automated build of develop@${develop_sha}. Merge this PR to publish it to GitHub Pages.")"
        echo "### Ready to publish" >> "$GITHUB_STEP_SUMMARY"
        echo "Review and merge to deploy: $pr_url" >> "$GITHUB_STEP_SUMMARY"
